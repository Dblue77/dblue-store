<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/logo.png" />

    <!-- Viewport dan Bootstrap Icons -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />

    <!-- Warna Tema -->
    <meta name="theme-color" content="#48A7FF" />

    <!-- ===== Meta Deskripsi Umum ===== -->
    <title>Dblue Store</title>
    <meta
      name="description"
      content="Dblue Store — Topup, akun premium, dan layanan digital termurah. Cepat, aman, terpercaya 💎"
    />

    <!-- ====== Open Graph (untuk WhatsApp, Telegram, Facebook) ====== -->
    <meta property="og:title" content="Dblue Store" />
    <meta
      property="og:description"
      content="Topup, akun premium, dan layanan digital termurah. Klik untuk cek harga!"
    />
    <meta property="og:image" content="%PUBLIC_URL%/logo.png" />
    <meta property="og:url" content="https://dblue-store.vercel.app/" />
    <meta property="og:type" content="website" />

    <!-- ====== Twitter Card (opsional tapi keren) ====== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dblue Store" />
    <meta
      name="twitter:description"
      content="Topup, akun premium, dan layanan digital termurah. Klik untuk cek harga!"
    />
    <meta name="twitter:image" content="%PUBLIC_URL%/logo.png" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.png" />

    <!-- Manifest (PWA) -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
